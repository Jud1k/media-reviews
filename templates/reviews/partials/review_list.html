<div id="review-list">
    <div id="review-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mt-6">
        {% if reviews %}
            {% for review in reviews %}
            <div class="flex">
                {% include 'reviews/partials/review_card.html' %}
            </div>
            {% endfor %}
        {% endif %}
    </div>

    {% if not reviews %}
    <div id="review-empty" class="text-center py-16">
        <h3 class="text-xl font-semibold text-gray-600 mb-2">Ни один отзыв не найден</h3>
    </div>
    {% endif %}

    {% include "reviews/partials/pagination.html" %}
</div>
