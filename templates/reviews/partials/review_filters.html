{% load static media_icons %}

<form id="review-filters"
      hx-get="{% url 'reviews:reviews' %}"
      hx-target="#review-list"
      hx-swap="outerHTML"
      class="mb-8 space-y-8">
    <input type="hidden"
           id="media_type"
           name="media_type"
           value="{{ filters.media_type|default:'' }}">

    <div class="flex flex-wrap gap-3">
        <button type="button"
                data-value=""
                class="flex cursor-pointer items-center gap-2 px-4 py-2 rounded-lg transition-colors {% if not filters.media_type %}bg-emerald-600 hover:bg-emerald-500 text-white{% else %}bg-gray-800 hover:bg-gray-700 text-gray-300{% endif %}"
                _="on click
                   set #media_type.value to ''
                   for btn in <button[data-value]/>
                     if btn.dataset.value is ''
                       add .bg-emerald-600 .hover\:bg-emerald-500 .text-white to btn
                       remove .bg-gray-800 .hover\:bg-gray-700 .text-gray-300 from btn
                     else
                       add .bg-gray-800 .hover\:bg-gray-700 .text-gray-300 to btn
                       remove .bg-emerald-600 .hover\:bg-emerald-500 .text-white from btn
                     end
                   end">
            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor">
                <use href="#icon-default"></use>
            </svg>
            <span class="text-gray-300">All</span>
        </button>

        {% for value,label in media_type_choices %}
        <button type="button"
                data-value="{{ value }}"
                class="flex cursor-pointer items-center gap-2 px-4 py-2 rounded-lg transition-colors {% if filters.media_type == value %}bg-emerald-600 hover:bg-emerald-500 text-white{% else %}bg-gray-800 hover:bg-gray-700 text-gray-300{% endif %}"
                _="on click
                   set #media_type.value to my dataset.value
                   for btn in <button[data-value]/>
                     if btn is me
                       add .bg-emerald-600 .hover\:bg-emerald-500 .text-white to btn
                       remove .bg-gray-800 .hover\:bg-gray-700 .text-gray-300 from btn
                     else
                       add .bg-gray-800 .hover\:bg-gray-700 .text-gray-300 to btn
                       remove .bg-emerald-600 .hover\:bg-emerald-500 .text-white from btn
                     end
                   end">
            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor">
                <use href="#{% get_media_icon value %}"></use>
            </svg>
            <span class="text-gray-300">{{ label }}</span>
        </button>
        {% endfor %}
    </div>

    <div class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-400 mb-2">Author</label>
                <input type="text"
                       name="author"
                       id="filter-author"
                       value="{{ filters.author|default:'' }}"
                       placeholder="Search by author..."
                       class="w-full px-4 py-2 bg-gray-800 border border-gray-700 rounded-lg text-gray-300 placeholder-gray-500 focus:border-purple-500 focus:ring-1 focus:ring-purple-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-400 mb-2">Title</label>
                <input type="text"
                       name="title"
                       id="filter-title"
                       value="{{ filters.title|default:'' }}"
                       placeholder="Search by title..."
                       class="w-full px-4 py-2 bg-gray-800 border border-gray-700 rounded-lg text-gray-300 placeholder-gray-500 focus:border-purple-500 focus:ring-1 focus:ring-purple-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-400 mb-2">Rating</label>
                <select name="rating_min"
                        id="filter-rating"
                        class="w-full cursor-pointer px-4 py-2 bg-gray-800 border border-gray-700 rounded-lg text-gray-300 focus:border-purple-500 focus:ring-1 focus:ring-purple-500 outline-none">
                    <option value="" {% if not filters.rating_min %}selected{% endif %}>All ratings</option>
                    <option value="9" {% if filters.rating_min == "9" %}selected{% endif %}>9+ Excellent</option>
                    <option value="7" {% if filters.rating_min == "7" %}selected{% endif %}>7+ Good</option>
                    <option value="5" {% if filters.rating_min == "5" %}selected{% endif %}>5+ Average</option>
                    <option value="3" {% if filters.rating_min == "3" %}selected{% endif %}>3+ Poor</option>
                </select>
            </div>
        </div>

        <div class="flex justify-end items-center gap-3">
            <button type="button" data-reset-filters
                    class="px-4 py-2 cursor-pointer bg-gray-800 text-gray-300 rounded-lg hover:bg-gray-700 transition-colors">
                Reset Filters
            </button>
            <button type="submit"
                class="px-6 py-2 cursor-pointer bg-emerald-600 text-white rounded-lg hover:bg-emerald-500 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                Apply Filters
                <img class="htmx-indicator h-5 w-5" src="{% static 'images/rings.svg' %}" alt="Loading..."/>
            </button>
        </div>
    </div>
</form>
