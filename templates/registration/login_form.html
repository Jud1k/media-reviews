{% load static %}

<div id = "login-container" class="max-w-md mx-auto mt-10 mb-10 p-8 border border-gray-500 rounded-xl shadow-sm bg-gray-600">
    <h2 class="text-2xl font-bold mb-4 text-center text-white">Sign in to your account</h2>
    <div class="text-center text-lg">
        <p class="text-white">
                Or
            <a href="{% url 'registration:signup' %}" 
            hx-get="{% url 'registration:signup' %}" 
            hx-target="body"
            hx-swap="innerHTML" 
            class="font-medium text-emerald-600 hover:text-emerald-500">
                    create a new account
            </a>
        </p>
    </div>
    <form method="post"
        hx-post="{% url 'registration:login' %}"  
        hx-target="closest div"
        hx-swap="outerHTML"
        class="mt-8 space-y-6">
            {% if form.non_field_errors %}
                <div class="p-3 mb-4 bg-red-50 border-l-4 border-red-500 text-red-700">
                    {% for error in form.non_field_errors %}
                        <p>{{ error }}</p>
                    {% endfor %}
                </div>
            {% endif %}

            {% for field in form %}
                <span class="text-white">
                    {{ field.label_tag }}
                </span>
                {{ field }}
            {% endfor %}

            <div class="flex items-center justify-between">
                <div class="text-sm">
                    <a href="{% url 'password_reset' %}" class="font-medium text-emerald-600 hover:text-emerald-500">
                        Forgot your password?
                    </a>
                </div>
            </div>

            <div class="relative"> 
                <button type="submit"        
                    class="w-full mt-2 py-3 flex items-center justify-center cursor-pointer bg-emerald-600 text-white font-medium rounded-lg 
                        hover:bg-emerald-700 active:bg-emerald-800 
                        transition-all duration-200 
                        focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:ring-offset-2
                        disabled:opacity-50 disabled:cursor-not-allowed
                        shadow-sm hover:shadow">
                    Sign in
                    <img class="htmx-indicator h-5 w-5" src="{% static 'images/rings.svg' %}" alt="Loading..."/>
                </button>
            </div>
        </form>
</div>
