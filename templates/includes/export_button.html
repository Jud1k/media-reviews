{% load static %}

<details class="relative group">
    <summary class="flex cursor-pointer items-center px-3 bg-gray-700 text-white text-lg rounded-xl hover:bg-gray-600 transition-all">
        <svg class="w-4 h-4 mr-2"><use href="#icon-export"></use></svg>
        <span class="border-l-2 border-gray-600 py-2 pl-2">Export</span>
        <svg class="w-4 h-4 ml-1 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        </svg>
    </summary>
    <div class="absolute right-0 mt-2 w-40 bg-gray-900 rounded-xl shadow-lg border border-zinc-800 overflow-hidden z-50">
        <a href="{% url 'reviews:review-export' %}?format=csv"
           class="flex items-center px-4 py-3 text-sm text-gray-300 hover:bg-gray-800 hover:text-white transition-colors">
            <svg class="w-4 h-4 mr-2 text-emerald-500"><use href="#icon-file-csv"></use></svg>
            CSV
        </a>
        <a href="{% url 'reviews:review-export' %}?format=json"
           class="flex items-center px-4 py-3 text-sm text-gray-300 hover:bg-gray-800 hover:text-white transition-colors">
            <svg class="w-4 h-4 mr-2 text-blue-500"><use href="#icon-file-json"></use></svg>
            JSON
        </a>
        <a href="{% url 'reviews:review-export' %}?format=xlsx"
           class="flex items-center px-4 py-3 text-sm text-gray-300 hover:bg-gray-800 hover:text-white transition-colors">
            <svg class="w-4 h-4 mr-2 text-green-500"><use href="#icon-file-xlsx"></use></svg>
            XLSX
        </a>
    </div>
</details>
